<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050510"/>
      <stop offset="50%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#050510"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid lines (perspective floor) -->
  <g stroke="#00d4ff" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="510" x2="1200" y2="510"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="570" x2="1200" y2="570"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>
  
  <!-- Hexagonal tower silhouette -->
  <g transform="translate(600, 260)">
    <!-- Central glow -->
    <ellipse cx="0" cy="0" rx="140" ry="200" fill="#00d4ff" opacity="0.04"/>
    <ellipse cx="0" cy="0" rx="80" ry="120" fill="#a855f7" opacity="0.03"/>
    
    <!-- Tower structure -->
    <g filter="url(#neon)">
      <!-- Hex units stacked -->
      <rect x="-70" y="-160" width="60" height="60" rx="6" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.9"/>
      <rect x="10" y="-160" width="60" height="60" rx="6" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.9"/>
      <rect x="-70" y="-90" width="60" height="60" rx="6" fill="none" stroke="#00d4ff" stroke-width="1.8" opacity="0.7"/>
      <rect x="10" y="-90" width="60" height="60" rx="6" fill="none" stroke="#00d4ff" stroke-width="1.8" opacity="0.7"/>
      <rect x="-70" y="-20" width="60" height="60" rx="6" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
      <rect x="10" y="-20" width="60" height="60" rx="6" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
      <rect x="-70" y="50" width="60" height="60" rx="6" fill="none" stroke="#a855f7" stroke-width="1.2" opacity="0.4"/>
      <rect x="10" y="50" width="60" height="60" rx="6" fill="none" stroke="#a855f7" stroke-width="1.2" opacity="0.4"/>
      
      <!-- Inner cores (glowing) -->
      <circle cx="-40" cy="-130" r="10" fill="#00d4ff" opacity="0.8"/>
      <circle cx="40" cy="-130" r="10" fill="#a855f7" opacity="0.8"/>
      <circle cx="-40" cy="-60" r="10" fill="#f5a623" opacity="0.7"/>
      <circle cx="40" cy="-60" r="10" fill="#00d68f" opacity="0.7"/>
      <circle cx="-40" cy="10" r="8" fill="#00d4ff" opacity="0.5"/>
      <circle cx="40" cy="10" r="8" fill="#ff4444" opacity="0.5"/>
      <circle cx="-40" cy="80" r="6" fill="#a855f7" opacity="0.4"/>
      <circle cx="40" cy="80" r="6" fill="#00d4ff" opacity="0.4"/>
    </g>
    
    <!-- Central beam -->
    <rect x="-4" y="-200" width="8" height="400" fill="url(#glow)" opacity="0.4"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" filter="url(#glow-strong)">
    SNT | 光躍星樞
  </text>
  <text x="600" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="url(#accent)" opacity="0.9" letter-spacing="6">
    ORBIT TOWER · 3D SAAS NEXUS
  </text>
  
  <!-- Bilingual tagline -->
  <text x="600" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" opacity="0.7">
    AI數位旗艦館 · 全球品牌展示平台
  </text>
  <text x="600" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#00d4ff" opacity="0.6">
    AI Digital Flagship Store · Global Brand Showcase Platform
  </text>
  <text x="600" y="568" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#a855f7" opacity="0.5">
    AIデジタルブランド館 · グローバルブランドショーケース
  </text>
  
  <!-- CTA badge -->
  <g transform="translate(600, 600)">
    <rect x="-140" y="-15" width="280" height="30" rx="15" fill="url(#accent)" opacity="0.15" stroke="url(#accent)" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#00d4ff" font-weight="bold" letter-spacing="2">
      7~14天快速部署 · 中英日三語
    </text>
  </g>
  
  <!-- Corner decorations -->
  <g stroke="#00d4ff" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 20 20 L 20 60 M 20 20 L 60 20"/>
    <path d="M 1180 20 L 1180 60 M 1180 20 L 1140 20"/>
    <path d="M 20 610 L 20 570 M 20 610 L 60 610"/>
    <path d="M 1180 610 L 1180 570 M 1180 610 L 1140 610"/>
  </g>
</svg>
